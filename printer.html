<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LMSV Printer Install</title>
</head>
<body>

    <h2>Welcome to the LMSV Printer Installer! Enter the red Printer #:</h2>
    <form id="redirectForm">
        <input type="text" id="userInput" placeholder="Type here..." required>
        <button type="submit">Go</button>
    </form>

    <script>
        document.getElementById('redirectForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Stop the form from submitting normally
            
            let input = document.getElementById('userInput').value.trim().toLowerCase();
            let targetUrl = '';

            // Map user input keywords to specific URLs
            if (input === '112802') {
                targetUrl = 'ipps://10.23.32.61/ipp/print';
           } else if (['96229','96230'].includes(input)) {
                targetUrl = 'https://docs.google.com/document/d/1brioDrSquFnmj4K8Y1lXCQaarXV1mVmGFQUxq08rqd8/edit?tab=t.0';
//            } else if (input.startsWith('http://') || input.startsWith('https://')) {
//                targetUrl = input; // Allow direct full URLs if entered
            } else {
                alert('Printer # not found. Please submit a SysAid ticket.');
                return;
            }

            // Redirect the user
            window.location.href = targetUrl;
        });
    </script>

</body>
</html>
